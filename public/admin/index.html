<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理 · 个人近况</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/admin.css"><script type="module" src="/assets/admin.js"></script></head><body><div class="page admin-page"><header class="site-header"><a href="/" class="site-name">个人近况</a><button id="logout" type="button">退出登录</button></header><main><div class="page-heading"><h1>管理</h1><p class="quiet">公开页面，私下打理。</p></div><p id="status" role="status" aria-live="polite">正在读取 GitHub 上的内容…</p><form id="editor" hidden><div class="editor-meta"><label>近况日期<input id="summary-date" type="date" required></label><span id="version" class="quiet"></span></div><div id="section-fields"></div><section class="habit-edit"><h2>当天习惯</h2><p class="quiet">未记录请留空，不会自动当成零。</p><div class="field-grid"><label>运动（分钟）<input id="exercise" type="number" min="0" max="1440"></label><label>阅读（分钟）<input id="reading" type="number" min="0" max="1440"></label><label>运动完成<select id="exercise-done"><option value="">未记录</option><option value="true">已完成</option><option value="false">确认未完成</option></select></label><label>复盘完成<select id="review"><option value="">未记录</option><option value="true">已完成</option><option value="false">确认未完成</option></select></label></div></section><details><summary>高级编辑：完整公开数据</summary><p class="quiet">仅含公开近况、历史和阅读展示信息。不要粘贴原始聊天、私人待办、账号信息或公司内部资料。</p><textarea id="json" spellcheck="false" rows="16" aria-label="完整公开数据 JSON"></textarea><button type="button" id="apply-json">载入这份数据</button></details><div class="publish-box"><label class="confirm"><input id="reviewed" type="checkbox" required>我已检查隐私，确认将以上内容发布到公开网站。</label><div class="actions"><button id="save" type="submit">保存并发布</button><button id="reload" type="button">重新载入</button><a href="/" target="_blank" rel="noopener">查看网站 ↗</a></div><p class="quiet">保存会产生一条 GitHub 版本记录；并发修改会阻止覆盖。文字会按原样显示，不执行 HTML。</p></div></form><section class="version-section"><h2>版本记录</h2><p class="quiet">恢复会把选定的公开内容保存为新版本，不删除任何历史。</p><button id="load-history" type="button">读取最近版本</button><ol id="history"></ol></section></main><footer class="site-footer"><a href="/">回到公开页面</a><span>内容保存在你的 GitHub</span></footer></div></body></html>
